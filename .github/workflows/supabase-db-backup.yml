name: Supabase database backup

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-backup
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check backup configuration without exposing secrets
        id: check
        env:
          HAS_SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL != '' }}
          HAS_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF != '' }}
          HAS_BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT != '' }}
          HAS_R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID != '' }}
          HAS_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAS_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAS_R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME != '' }}
        run: |
          if [[ "$HAS_SUPABASE_DB_URL" != "true" || \
                "$HAS_SUPABASE_PROJECT_REF" != "true" || \
                "$HAS_BACKUP_AGE_RECIPIENT" != "true" || \
                "$HAS_R2_ACCOUNT_ID" != "true" || \
                "$HAS_R2_ACCESS_KEY_ID" != "true" || \
                "$HAS_R2_SECRET_ACCESS_KEY" != "true" || \
                "$HAS_R2_BUCKET_NAME" != "true" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backup skipped: configure the documented GitHub secrets and variables first."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  backup:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install age and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes age awscli

      - name: Create, encrypt, upload, and verify database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: bash scripts/backup-supabase-db.sh
