<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="no-cache">
    <title>Manos Tech System</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background: #020812;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
      }
      .manos-tech-card {
        width: min(100%, 420px);
        padding: 40px 28px;
        border: 1px solid rgba(34, 211, 238, .28);
        border-radius: 24px;
        background: #07111d;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, .45);
      }
      .manos-tech-logo {
        display: block;
        width: 180px;
        max-width: 72%;
        height: auto;
        margin: 0 auto 18px;
      }
      .manos-tech-subtitle {
        margin: 0 0 26px;
        color: #94a3b8;
        font-size: 12px;
        letter-spacing: .2em;
        text-transform: uppercase;
      }
      #manos-tech-message { margin: 0; color: #cbd5e1; font-size: 15px; }
      .manos-tech-loader {
        width: 32px;
        height: 32px;
        margin: 24px auto 0;
        border: 3px solid rgba(34, 211, 238, .18);
        border-top-color: #22d3ee;
        border-radius: 50%;
        animation: manos-tech-spin .8s linear infinite;
      }
      @keyframes manos-tech-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .manos-tech-loader { animation-duration: 1.8s; }
      }
    </style>
  </head>
  <body>
    <main class="manos-tech-card">
      <img class="manos-tech-logo" src="https://manostech-system.com.br/mikrotik/manos-tech-logo.jpg" alt="Logo Manos Tech">
      <p class="manos-tech-subtitle">Wi-Fi inteligente</p>
      <p id="manos-tech-message" role="status">Preparando seu acesso seguro…</p>
      <div class="manos-tech-loader" aria-hidden="true"></div>
    </main>
    <!-- RouterOS replaces $(...) before sending this form. -->
    <form id="manos-tech-entry" method="post" action="https://manostech-system.com.br/api/public/hotspot-entry" hidden>
      <input type="hidden" name="router-id" value="$(identity)">
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="link-login-only" value="$(link-login-only)">
      <input type="hidden" name="link-orig" value="$(link-orig)">
    </form>
    <!-- MANOS-LOCAL-LOGIN-V2 -->
    <form id="manos-tech-router-login" method="post" action="$(link-login-only)" style="display:none">
      <input type="hidden" name="username">
      <input type="hidden" name="password">
      <input type="hidden" name="dst">
    </form>
    <script>
      (function () {
        // The external portal is HTTPS while RouterOS serves this local page
        // over HTTP. Returning to this page first keeps the credential POST
        // same-origin and avoids browsers blocking HTTPS-to-HTTP form submits.
        var handoff = new URLSearchParams(window.location.hash.slice(1));
        var username = handoff.get("u");
        var password = handoff.get("p");
        if (username && password) {
          window.history.replaceState(null, "", window.location.pathname + window.location.search);
          var login = document.getElementById("manos-tech-router-login");
          login.elements.namedItem("username").value = username;
          login.elements.namedItem("password").value = password;
          login.elements.namedItem("dst").value = handoff.get("dst") || "";
          document.getElementById("manos-tech-message").textContent = "Concluindo seu acesso seguro…";
          login.submit();
          return;
        }
        document.getElementById("manos-tech-entry").submit();
      })();
    </script>
  </body>
</html>
