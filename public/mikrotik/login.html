<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="no-cache">
    <title>Conectando ao Wi-Fi</title>
  </head>
  <body>
    <p>Redirecionando para o acesso Wi-Fi…</p>
    <!-- Redirecionamento HTTPS direto evita o aviso de formulário inseguro do navegador. -->
    <script>
      const params = new URLSearchParams({
        "router-id": "$(identity)",
        mac: "$(mac)",
        ip: "$(ip)",
        "link-login-only": "$(link-login-only)",
        "link-orig": "$(link-orig)"
      });
      window.location.replace("https://manostech-system.com.br/api/public/hotspot-entry?" + params.toString());
    </script>
  </body>
</html>
