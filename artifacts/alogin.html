<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="no-cache">
    <title>Conectado — Manos Tech</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #05080f;
        color: #f8fafc;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        padding: 32px 24px;
        border-radius: 20px;
        background: #0b1118;
        border: 1px solid rgba(34, 211, 238, 0.25);
      }
      h1 { font-size: 18px; margin: 0 0 8px; color: #22d3ee; }
      p { font-size: 14px; color: #cbd5e1; margin: 0; }
    </style>
    <script>
      (function () {
        var orig = "$(link-orig)";
        var fallback = "https://manostech-system.com.br/";
        // Domínios usados por iOS, Android e Windows apenas para testar conexão
        var probePattern = /(captive\.apple\.com|connectivitycheck\.|clients3\.google\.com|msftconnecttest\.com|msftncsi\.com|nmcheck\.gnome\.org|network-test\.debian\.org)/i;

        var target = orig;
        if (!target || target.indexOf("$(") === 0 || probePattern.test(target)) {
          target = fallback;
        }
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <div class="card">
      <h1>Wi-Fi liberado!</h1>
      <p>Você já está conectado. Redirecionando…</p>
    </div>
  </body>
</html>
