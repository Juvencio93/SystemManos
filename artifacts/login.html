<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="cache-control" content="no-cache">
    <title>Conectando ao Wi-Fi</title>
  </head>
  <body>
    <p>Redirecionando para o acesso Wi-Fi…</p>

    <!-- RouterOS replaces $(...) before sending this form. -->
    <form id="manos-tech-entry" method="post" action="https://manostech-system.com.br/api/public/hotspot-entry">
      <input type="hidden" name="router-id" value="$(identity)">
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="link-login-only" value="$(link-login-only)">
      <input type="hidden" name="link-orig" value="$(link-orig)">
    </form>

    <script>document.getElementById("manos-tech-entry").submit();</script>
  </body>
</html>
